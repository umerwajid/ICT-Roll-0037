<!DOCTYPE html>
<html>
<head>
  <title>Task 3</title>
</head>
<body>

  <h3>Simple Addition</h3>
  <input type="text" id="n1" placeholder="First number">
  <input type="text" id="n2" placeholder="Second number">
  <button onclick="add()">Add</button>
  <p>Answer: <span id="ans">0</span></p>

  <script>
    function add() {
      var a = Number(document.getElementById("n1").value);
      var b = Number(document.getElementById("n2").value);
      var sum = a + b;
      document.getElementById("ans").innerHTML = sum;
    }
  </script>

</body>
</html>
