<!DOCTYPE html>
<html>

<head>
    <title>Task 1</title>
</head>

<body>

    <h3>Click to change background color</h3>
    <button onclick="changeBg()">Change Color</button>

    <script>
        var colors = ["red", "blue", "green", "yellow", "purple", "orange"];
        var i = 0;

        function changeBg() {
            document.body.style.backgroundColor = colors[i];
            i++;
            if (i == colors.length) {
                i = 0;
            }
        }
    </script>

</body>

</html>
