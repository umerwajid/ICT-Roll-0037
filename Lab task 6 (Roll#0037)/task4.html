
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 4</title>



    <style>
        body {
            background-color: rgb(11, 11, 12);
        }
        .login-box {
            width: 300px;
            margin: 100px auto;
            background-color: azure;
            border: 5px solid black;
            padding: 20px;
            border-radius: 50px;
        }
        input {
            width: 90%;
            padding: 8px;
            margin-bottom: 15px;
            border: 2px solid rgb(16, 238, 227);
        }
        .submit-btn {
            background-color: rgb(50, 104, 206);
            color: white;
            font-weight: bold;
            width: 100%;
            padding: 10px;

        }
        .forgot-link {
            display: block;
            margin-top: 15px;
            color: purple;
        }
    </style>
</head>
<body>

    <div class="login-box">
        <h2>LOGIN HERE</h2>
        <label>Username:</label>
        <input type="text">
        
        <label>Password:</label>
        <input type="password">
        
        <button class="submit-btn">Submit</button>
        <a href="#" class="forgot-link">Forgot Password?</a>
    </div>

</body>
</html>
