<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <style>
        ul {
            list-style-type: none;
            background-color: rgb(37, 176, 201);
            margin: 0;
            padding: 20px;
        }
        li {
            display: inline;
            margin-right: 50px;
        }
        a {
            color: rgb(246, 246, 250);
            font-size: 25px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-decoration: none;
        }
        a:hover {
            color: rgb(17, 0, 255);
            background-color: rgb(98, 221, 230);
            text-decoration: wavy;
            
        }
        /* Very basic media query */
        @media screen and (max-width: 600px) {
            li {
                display: block;
                margin-bottom: 10px;
            }
        }
    </style>


    <title>Task 2</title>
</head>
<body>
      <ul>
        <li><a href="#">Home</a></li>
        <li><a href="#">About</a></li>
        <li><a href="#">Services</a></li>
        <li><a href="#">Contact</a></li>
    </ul>
</body>
</html>
